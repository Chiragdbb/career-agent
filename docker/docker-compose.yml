services:
  postgres:
    image: postgres:16
    container_name: career-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chirag
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: career_agent
    ports:
      - "5432:5432"
    volumes:
      - career_pg_data:/var/lib/postgresql/data
volumes:
  career_pg_data:
