# Local development infrastructure only (Postgres + Redis).
# Do not add API, worker, or frontend services here yet.
#
# From repo root:
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
#   docker compose --env-file .env -f docker/docker-compose.yml down

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: career-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career}
      POSTGRES_DB: ${POSTGRES_DB:-career_agent}
    ports:
      # Host 5433 avoids clashing with a native Windows/macOS Postgres on 5432.
      - "5433:5432"
    volumes:
      - career_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: career-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - career_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  career_pg_data:
  career_redis_data:
